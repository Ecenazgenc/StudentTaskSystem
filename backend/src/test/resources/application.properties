spring.application.name=student-task-system-test

# In-Memory H2 Veritabanı Test Ayarları (MSSQL Uyumluluk Modu)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MSSQLServer
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate & JPA Test Ayarları
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Test E-Posta Ayarları
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@studenttasksystem.com
spring.mail.password=

